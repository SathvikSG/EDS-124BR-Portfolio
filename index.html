<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDS 124BR Video Portfolio</title>
<style>
  :root { --bg: #fafafa; --fg: #1a1a1a; --muted: #666; --card: #fff; --border: #e5e5e5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --fg: #eaeaea; --muted: #9a9a9a; --card: #1c1c1c; --border: #2c2c2c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 1.8rem; }
  .sub { margin: 0 0 32px; color: var(--muted); }
  .grid { display: grid; gap: 24px; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); }
  @media (max-width: 440px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .card h2 { margin: 0; padding: 12px 14px; font-size: 1rem; font-weight: 600; }
  .frame { position: relative; aspect-ratio: 16 / 9; background: #000; }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<main>
  <h1>EDS 124BR Video Portfolio</h1>
  <p class="sub">Sathvik Guntha</p>
  <div class="grid" id="videos"></div>
</main>
<script>
  const videos = [
    ["Week 1", "PJqOlBJJByY"],
    ["Code Explanation Repeats", "HTSlDFOu3TM"],
    ["Repeat Animal Parade", "1ptq4jClCiU"],
    ["nested repeats", "BVmO6WbDiVA"],
    ["Monkey and Banana Minigame", "y-Beh6orcxM"],
  ];
  const grid = document.getElementById("videos");
  for (const [title, id] of videos) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      '<div class="frame"><iframe src="https://www.youtube-nocookie.com/embed/' + id +
      '" title="' + title + '" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div>' +
      '<h2>' + title + '</h2>';
    grid.appendChild(card);
  }
</script>
</body>
</html>
